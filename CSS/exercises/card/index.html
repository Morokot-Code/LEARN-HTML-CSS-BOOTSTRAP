<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="discount">%20</div>
        <div class="fav"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart-fill" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
        </svg></div>

        <div class="box-img">
            <img src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/SPX1C-2000x1500-BB-D-00?wid=1200&hei=900&qlt=90&bgc=F2F2F2F2&fmt=jpg" alt="">
        </div>
        <div class="card-item">

            <div class="tag">
                <span class="gaming-tag">Gaming</span>
                <span class="instock-tag">Instock</span>
            </div>

            <div class="title">
                <h2>Gaming Laptop</h2>
                <p>Surface Laptop, 13.8-inch (7th Edition),Snapdragon® X Plus (10 Core) or Snapdragon® X Elite (12 Core)</p>
            </div>

            <div class="rating-star">

                </svg></span>

                <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
                    <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
