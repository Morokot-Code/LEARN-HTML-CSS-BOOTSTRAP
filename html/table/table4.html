<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table align="center" border="1" style="border: 1px; border-spacing: 0px; width: 70%;">
        <tr>
            <th colspan="5">Table</th>
        </tr>
        <tr align="center">
            <td rowspan="2">A</td>
            <td colspan="3">B</td>
            <td>C</td>
        </tr>
        <tr align="center">
            <td>D</td>
            <td>E</td>
            <td colspan="2">F</td>
        </tr>
        <tr align="center">
            <td colspan="3">G</td>
            <td colspan="2" rowspan="2">H</td>
        </tr>
        <tr align="center">
            <td colspan="2">I</td>
            <td>J</td>
        </tr>
        <tr align="center">
            <td colspan="2" rowspan="2">K</td>
            <td>L</td>
            <td>M</td>
            <td>N</td>
        </tr>
        <tr align="center">
            <td>O</td>
            <td colspan="2">P</td>
        </tr>
        
    </table>
</body>
</html>
