<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form style="border: 1px solid; width: 40%; padding: 5px;">
        <h1>Student Register</h1>
        <label for="">Name: </label>
        <input type="text">
        <br><br>

        <label for="">Email Address: </label>
        <input type="email">
        <br><br>

        <label for="">Password: </label>
        <input type="tel">
        <br><br>
        
        <label for="">Date of Birth: </label>
        <input type="date">
        <br><br>

        <label for="">Gender: </label>
        <input type="radio" name="Male" value="Male">Male
        <input type="radio" name="Female" value="Female">Female
        <br><br>

        <label for="">Course</label>
        <select name="" id="">
            <option value="">HTML</option>
            <option value="">CSS</option>
            <option value="">Java Script</option>
        </select>
        <br><br>

        <label for="">Skills You Have:</label><br>
        <input type="checkbox">HTML <br>
        <input type="checkbox">CSS <br>
        <input type="checkbox">JavaScript
        <br><br>

        <label for="">Additional Comments</label><br>
        <textarea name="" id="" placeholder="Enter Your Comments"></textarea>
        <br><br>

        <label for="">Upload Your File:</label><br><br>
        <input type="file"><br><br>

        <button type="submit">Upload</button>
        <br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
